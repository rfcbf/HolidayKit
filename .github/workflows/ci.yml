name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Monthly data updates are tested inside the Update holidays workflow before they merge.
    if: ${{ !startsWith(github.head_ref, 'update/python-holidays-') }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Test
        run: swift test
