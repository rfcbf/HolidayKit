name: Update holidays

# Once a month, regenerates Sources/HolidayKit/Resources/holidays.json from the latest
# python-holidays release. When countries added, removed or moved holidays and the tests pass, it
# opens a pull request, merges it and releases the next minor version (2.0.0 -> 2.1.0), with no
# manual review: python-holidays is the source of truth.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install python-holidays
        run: |
          python3 -m venv env
          env/bin/pip install --quiet --upgrade holidays
          echo "VERSION=$(env/bin/python -c 'import holidays; print(holidays.__version__)')" >> "$GITHUB_ENV"
      - name: Generate catalog
        run: env/bin/python -I -W ignore Scripts/generate_catalog.py
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- Sources/HolidayKit/Resources/holidays.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Test
        if: steps.diff.outputs.changed == 'true'
        run: swift test
      - name: Merge and release
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="update/python-holidays-$VERSION-$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Sources/HolidayKit/Resources/holidays.json
          git commit -m "Update holidays from python-holidays $VERSION"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "Update holidays from python-holidays $VERSION" \
            --body "Regenerated by the monthly workflow from python-holidays $VERSION. Tests passed on macOS. Merged and released automatically."
          gh pr merge "$branch" --squash --delete-branch
          git fetch origin main --tags
          last=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          IFS=. read -r major minor patch <<< "${last:-2.0.0}"
          next="$major.$((minor + 1)).0"
          gh release create "$next" --target main --title "HolidayKit $next" \
            --notes "Holidays updated from python-holidays $VERSION (MIT)."
